name: Build & Release (Web + Android)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.1.0)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release after build'
        required: false
        type: boolean
        default: true
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string
        default: ''

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        working-directory: apps/web
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          WRANGLER_SEND_METRICS: 'false'
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ env.VERSION }}
          path: |
            apps/web/.open-next/
            apps/web/.next/
            apps/web/dist/
            apps/web/public/
          retention-days: 30
          overwrite: true

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x apps/android/gradlew

      - name: Build OSS release APK
        working-directory: apps/android
        run: |
          ./gradlew assembleOssRelease \
            -PversionName="${{ env.VERSION }}" \
            -PversionCode="${{ github.run_number }}" \
            --stacktrace \
            --no-daemon

      - name: Build Direct release APK
        working-directory: apps/android
        run: |
          ./gradlew assembleDirectRelease \
            -PversionName="${{ env.VERSION }}" \
            -PversionCode="${{ github.run_number }}" \
            --stacktrace \
            --no-daemon

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ env.VERSION }}
          path: |
            apps/android/app/build/outputs/apk/oss/release/*.apk
            apps/android/app/build/outputs/apk/direct/release/*.apk
            apps/android/app/build/outputs/mapping/ossRelease/mapping.txt
            apps/android/app/build/outputs/mapping/directRelease/mapping.txt
          retention-days: 30
          overwrite: true

  release:
    name: Create GitHub Release
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.create_release == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Download Web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ env.VERSION }}
          path: artifacts/web/

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build-${{ env.VERSION }}
          path: artifacts/android/

      - name: Delete existing release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.VERSION }}"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Orange Cloud v${{ env.VERSION }}
          body: |
            ${{ github.event.inputs.release_notes }}

            ## Build Artifacts
            - **Android**: OSS & Direct APKs (Pro features unlocked in OSS flavor)
            - **Web**: Next.js static output for Cloudflare Workers deployment

            ## Notes
            - iOS build requires Apple Developer certificate and is not included in CI.
            - Android OSS flavor has all Pro features enabled at zero cost.
            - Web app requires your own Cloudflare OAuth Client and callback relay.
          draft: false
          prerelease: false
          files: |
            artifacts/android/**/*.apk
            artifacts/web/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
