name: Build & Release (Web + Android)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.1.0)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release after build'
        required: false
        type: boolean
        default: true
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string
        default: ''

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        working-directory: apps/web
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          WRANGLER_SEND_METRICS: 'false'
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ env.VERSION }}
          path: |
            apps/web/.open-next/
            apps/web/.next/
            apps/web/dist/
            apps/web/public/
          retention-days: 30
          overwrite: true

  build-android:
    name: Build Android (OSS Only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x apps/android/gradlew

      - name: Build OSS release APK
        working-directory: apps/android
        run: |
          ./gradlew assembleOssRelease \
            -PversionName="${{ env.VERSION }}" \
            -PversionCode="${{ github.run_number }}" \
            --parallel \
            --build-cache \
            --configure-on-demand \
            -x lintVitalOssRelease \
            --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ env.VERSION }}
          path: |
            apps/android/app/build/outputs/apk/oss/release/*.apk
            apps/android/app/build/outputs/mapping/ossRelease/mapping.txt
          retention-days: 30
          overwrite: true

  release:
    name: Create GitHub Release
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.create_release == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Download Web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ env.VERSION }}
          path: artifacts/web/

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build-${{ env.VERSION }}
          path: artifacts/android/

      # action-gh-release 并发上传多个 asset 时存在 race condition，
      # 改用 gh CLI 串行处理：先删除旧 release，再创建新 release 并逐个上传。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.VERSION }}"
          REPO="${{ github.repository }}"

          # 1. 彻底删除旧 release 和 tag
          echo "Deleting existing release and tag: $TAG"
          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" 2>/dev/null || true

          # 2. 等待 GitHub API 同步（避免删除后立即创建导致竞态）
          sleep 5

          # 3. 创建 release notes 文件
          cat > /tmp/release_notes.md << 'EOF'
          ${{ github.event.inputs.release_notes }}

          ## Build Artifacts
          - **Android**: OSS APK (all Pro features unlocked at zero cost)
          - **Web**: Next.js static output for Cloudflare Workers deployment

          ## Notes
          - iOS build requires Apple Developer certificate and is not included in CI.
          - Android OSS flavor has all Pro features enabled at zero cost.
          - Web app requires your own Cloudflare OAuth Client and callback relay.
          EOF

          # 4. 创建 release（不带 asset，避免 create 时文件过多）
          echo "Creating release: $TAG"
          gh release create "$TAG"             --repo "$REPO"             --title "Orange Cloud ${TAG}"             --notes-file /tmp/release_notes.md

          # 5. 逐个上传 Android APK（串行，避免 race condition）
          echo "Uploading Android APKs..."
          for f in artifacts/android/**/*.apk; do
            [ -f "$f" ] || continue
            echo "  Uploading: $f"
            gh release upload "$TAG" --repo "$REPO" --clobber "$f"
          done

          # 6. 逐个上传 Web 产物（串行）
          echo "Uploading Web artifacts..."
          find artifacts/web -type f | while read -r f; do
            echo "  Uploading: $f"
            gh release upload "$TAG" --repo "$REPO" --clobber "$f"
          done

          echo "Release $TAG created successfully."
