packages:
  - 'apps/web'
  - 'packages/*'
# 安全补丁：把存在 Dependabot 漏洞的间接依赖强制抬到补丁版（按漏洞范围精准命中，不跨大版本）
overrides:
  'undici@>=7.0.0 <7.29.0': '7.29.0'
  'form-data@>=4.0.0 <4.0.6': '4.0.6'
  'ws@>=8.0.0 <8.21.0': '8.21.0'
  'postcss@<8.5.23': '8.5.23'
  'esbuild@>=0.27.3 <0.28.1': '0.28.1'
  'body-parser@>=2.0.0 <2.3.0': '2.3.0'
  'js-yaml@>=4.0.0 <4.3.1': '4.3.1'
  'sharp@<0.35.0': '0.35.0'
  'nanoid@<3.3.16': '3.3.16'
  'nanoid@>=4.0.0 <5.1.6': '5.1.6'
  # brace-expansion：每个公告对 1.x / 2.x / 3.x / 4-5.x 各有独立修复版，四条线都得钉；
  # GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895 取各线较高者
  'brace-expansion@<1.1.18': '1.1.18'
  'brace-expansion@>=2.0.0 <2.1.4': '2.1.4'
  'brace-expansion@>=3.0.0 <3.0.6': '3.0.6'
  'brace-expansion@>=4.0.0 <5.0.9': '5.0.9'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
